# Per-robot ros_gz_bridge config TEMPLATE.
# spawn_robot.launch.py replaces the placeholders and writes a temp copy:
#   <robot_name>  -> robot_1, robot_2, ...
#   <tf_topic>    -> /tf (shared) or /<robot_name>/tf (tf_per_robot:=true)
# Frames in the TF messages are already prefixed "<robot_name>/..." by gz-sim.

# ---- command / odometry / state ----
- ros_topic_name: "/<robot_name>/cmd_vel"
  gz_topic_name: "/<robot_name>/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/<robot_name>/odom"
  gz_topic_name: "/<robot_name>/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint transform from DiffDrive.
# Remove this entry if robot_localization publishes odom -> base_footprint instead.
- ros_topic_name: "<tf_topic>"
  gz_topic_name: "/<robot_name>/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/joint_states"
  gz_topic_name: "/<robot_name>/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ---- sensors ----
- ros_topic_name: "/<robot_name>/scan"
  gz_topic_name: "/<robot_name>/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/imu"
  gz_topic_name: "/<robot_name>/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ---- ZED stereo ----
- ros_topic_name: "/<robot_name>/zed/left/image_raw"
  gz_topic_name: "/<robot_name>/zed/left/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/left/camera_info"
  gz_topic_name: "/<robot_name>/zed/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/right/image_raw"
  gz_topic_name: "/<robot_name>/zed/right/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/right/camera_info"
  gz_topic_name: "/<robot_name>/zed/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ---- ZED center RGB-D (gz name -> ROS name) ----
- ros_topic_name: "/<robot_name>/zed/rgb/image_raw"
  gz_topic_name: "/<robot_name>/zed/rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/depth/image_raw"
  gz_topic_name: "/<robot_name>/zed/rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/depth/camera_info"
  gz_topic_name: "/<robot_name>/zed/rgbd/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/<robot_name>/zed/point_cloud"
  gz_topic_name: "/<robot_name>/zed/rgbd/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
